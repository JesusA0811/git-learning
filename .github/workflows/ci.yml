name: Python CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel outdated pull request runs when new commits arrive.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read


jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Ruff
        run: python -m ruff check src tests

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -v --junitxml=test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: error
          retention-days: 7

      - name: Validate documentation
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          grep -q "Learning Git" README.md

  collect-reports:
    name: Collect Python Test Reports
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Download test artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pytest-results-*
          path: reports

      - name: Display downloaded reports
        run: |
          echo "Downloaded test reports:"
          find reports -type f

  ci-gate:
    name: Final CI Gate
    needs: [lint, test, collect-reports]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Verify required jobs
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          REPORT_RESULT: ${{ needs.collect-reports.result }}
        run: |
          echo "Lint: $LINT_RESULT"
          echo "Tests: $TEST_RESULT"
          echo "Reports: $REPORT_RESULT"

          test "$LINT_RESULT" = "success"
          test "$TEST_RESULT" = "success"
          test "$REPORT_RESULT" = "success"

          echo "All CI stages passed!"
