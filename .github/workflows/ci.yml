
name: Python CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip' #tells github actions to cache pip's downloaded packages
          cache-dependency-path: 
          #requirements.txt Specifies which dependency file should be hashed to help identify the appropriate cache.

      - name: Display Python version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      
      - name: Run unit tests
        run: |
          python -m pytest -v --junitxml=test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: error
          retention-days: 7


      - name: Validate documentation
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          grep -q "Learning Git" README.md

  
  collect-reports:
    name: Collect Python Test Reports
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pytest-results-*
          path: reports

      - name: Display downloaded reports
        run: |
          echo "Downloaded test reports:"
          find reports -type f

