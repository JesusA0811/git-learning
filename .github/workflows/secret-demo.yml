
name: Secret Security Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-secret:
    name: Verify Demo Secret
    runs-on: ubuntu-latest

    steps:
      - name: Check secret availability
        env:
          DEMO_KEY: ${{ secrets.LEARNING_API_KEY }}
        run: |
          if [ -n "$DEMO_KEY" ]; then
            echo "Secret is configured successfully."
          else
            echo "Secret is missing."
            exit 1
          fi
